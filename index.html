<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎃 ハロウィン・早押しタップ！</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #1a1a2e;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 15px;
      user-select: none;
    }
    h1 { color: #ff9f43; font-size: 22px; margin-bottom: 10px; }
    .card {
      background: #16213e;
      border-radius: 12px;
      padding: 15px;
      max-width: 380px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      margin-bottom: 15px;
      text-align: center;
    }
    button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
    }
    /* カボチャが出現するプレイエリア */
    #play-area {
      position: relative;
      width: 100%;
      height: 280px;
      background: #0f172a;
      border-radius: 10px;
      margin: 15px 0;
      overflow: hidden;
      border: 2px solid #334155;
    }
    /* 出現するカボチャボタン（初期状態は完全に非表示） */
    #target-pumpkin {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #ff9f43;
      display: none; /* 初期状態は非表示 */
      align-items: center;
      justify-content: center;
      font-size: 40px;
      cursor: pointer;
      box-shadow: 0 0 15px #ff9f43;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #target-pumpkin:active { transform: scale(0.9); }
    .hidden { display: none !important; }
    .score-display { font-size: 44px; color: #feca57; font-weight: bold; margin: 10px 0; }
    .feedback { font-size: 18px; height: 24px; color: #48dbfb; font-weight: bold; }
    .info-text { font-size: 14px; color: #cbd5e1; }
  </style>
</head>
<body>

<div class="card">
  <h1>🎃 ハロウィン・早押しタップ！ 🎃</h1>

  <!-- 1. スタート画面 -->
  <div id="start-screen">
    <p class="info-text">出てくるカボチャをどれだけ早く押せるか競うゲーム！（全5回）</p>
    <input type="text" id="username" placeholder="お名前（ダンサー名）" />
    <br>
    <button onclick="startGame()">ゲームスタート！</button>
  </div>

  <!-- 2. プレイ画面 -->
  <div id="game-screen" class="hidden">
    <div id="status" class="info-text">画面をよく見てね...</div>
    <div class="feedback" id="feedback"></div>
    
    <div id="play-area">
      <!-- 初回は完全に見えない状態 -->
      <div id="target-pumpkin" onclick="handleTap()">🎃</div>
    </div>
    
    <p class="info-text">残り: <span id="remaining" style="font-weight:bold; color:#ff9f43;">5</span> 回</p>
  </div>

  <!-- 3. 結果画面 -->
  <div id="result-screen" class="hidden">
    <h2>🎉 おつかれさまでした！</h2>
    <p><strong id="res-name"></strong> さんのスコア</p>
    <div class="score-display" id="final-score">0 点</div>
    <p class="info-text" style="color: #94a3b8;">この画面をスクリーンショットして<br>見せてね！</p>
    <button onclick="resetGame()">もう一度あそぶ</button>
  </div>
</div>

<script>
  let playerName = "";
  let currentCount = 0;
  const maxCount = 5;
  let appearanceTime = 0;
  let scores = [];
  let timerId = null;

  function startGame() {
    const nameInput = document.getElementById('username').value.trim();
    if (!nameInput) {
      alert("名前を入力してください！");
      return;
    }
    playerName = nameInput;
    scores = [];
    currentCount = 0;

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');

    // 最初に確実にカボチャを消しておく
    document.getElementById('target-pumpkin').style.display = 'none';

    nextTurn();
  }

  function nextTurn() {
    if (currentCount >= maxCount) {
      endGame();
      return;
    }

    currentCount++;
    document.getElementById('remaining').innerText = maxCount - currentCount + 1;
    document.getElementById('feedback').innerText = "";
    document.getElementById('status').innerText = "集中...どこに出るかな？";
    
    // 待機中はカボチャを絶対に見せない
    document.getElementById('target-pumpkin').style.display = 'none';

    // 1.5〜3.5秒のランダムな待ち時間後にカボチャを出現させる
    const delay = Math.floor(Math.random() * 2000) + 1500;

    timerId = setTimeout(() => {
      showPumpkin();
    }, delay);
  }

  function showPumpkin() {
    const area = document.getElementById('play-area');
    const pumpkin = document.getElementById('target-pumpkin');

    // プレイエリア内でランダムな位置（端からはみ出さないよう計算）
    const maxX = area.clientWidth - 70;
    const maxY = area.clientHeight - 70;

    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * maxY);

    pumpkin.style.left = randomX + 'px';
    pumpkin.style.top = randomY + 'px';

    // 出現の瞬間だけ flex で表示
    pumpkin.style.display = 'flex';
    document.getElementById('status').innerText = "出た！押せ！！";
    
    // 出現した瞬間の時間を記録
    appearanceTime = Date.now();
  }

  function handleTap() {
    if (!appearanceTime) return;

    // タップした時間と出現時間の差（反応速度：ミリ秒）
    const reactionTime = Date.now() - appearanceTime;
    appearanceTime = 0;

    // タップしたら即座に消す
    document.getElementById('target-pumpkin').style.display = 'none';

    // 反応スピードに応じたスコア計算（200ms以下で満点100pt）
    let point = Math.max(0, 100 - Math.floor((reactionTime - 200) / 8));
    scores.push(point);

    let fb = "超神速!!";
    if (reactionTime > 250) fb = "PERFECT!!";
    if (reactionTime > 350) fb = "GREAT!";
    if (reactionTime > 500) fb = "GOOD";
    if (reactionTime > 700) fb = "SLOW...";

    document.getElementById('feedback').innerText = `${fb} (${reactionTime}ms)`;

    // 次のターンへ
    setTimeout(nextTurn, 1000);
  }

  function endGame() {
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    // 5回の平均スコア算出
    const total = scores.reduce((a, b) => a + b, 0);
    const avgScore = Math.round(total / maxCount);

    document.getElementById('res-name').innerText = playerName;
    document.getElementById('final-score').innerText = avgScore + " 点";
  }

  function resetGame() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
